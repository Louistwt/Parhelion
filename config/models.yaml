# Candidate models per stage. The FIRST entry is the default; pick another with --model <key>.
# Models are NOT decided yet — this list is for the smoke-test comparison (see STATE.md).
# `text_endpoint` is used when there are no reference images, `edit_endpoint` when there are.
# `params` are passed through to the provider unchanged. Prices live in config/prices.yaml.
# `sheet_params` (image models) override `params` for character sheets only: three full-body views in one row
# need a landscape canvas. Keyframes stay 9:16.

image:
  - key: seedream-v4
    provider: fal
    text_endpoint: fal-ai/bytedance/seedream/v4/text-to-image
    edit_endpoint: fal-ai/bytedance/seedream/v4/edit
    verified: 2026-09-24        # params checked on fal model page
    params:
      image_size: {width: 1080, height: 1920}
      enable_safety_checker: true
    sheet_params:               # 2026-09-27: custom size OK if total pixels are between 960x960 and 4096x4096
      image_size: {width: 1920, height: 1080}
    face_params:                # face portraits (square); enum value verified 2026-09-27
      image_size: square_hd

  - key: nano-banana
    provider: fal
    text_endpoint: fal-ai/nano-banana
    edit_endpoint: fal-ai/nano-banana/edit
    verified: 2026-09-24
    params:
      aspect_ratio: "9:16"
      output_format: png
    sheet_params:
      aspect_ratio: "16:9"      # 2026-09-27: allowed values 21:9 16:9 3:2 4:3 5:4 1:1 4:5 3:4 2:3 9:16
    face_params:
      aspect_ratio: "1:1"

  - key: flux-kontext-pro
    provider: fal
    text_endpoint: fal-ai/flux-pro/kontext/text-to-image
    edit_endpoint: fal-ai/flux-pro/kontext/multi
    verified: null              # endpoint ids + price confirmed via fal pricing API 2026-09-24; params NOT verified
    params:
      aspect_ratio: "9:16"
    sheet_params:
      aspect_ratio: "16:9"      # 2026-09-27: allowed values 21:9 16:9 4:3 3:2 1:1 2:3 3:4 9:16 9:21
    face_params:
      aspect_ratio: "1:1"

# ---------- voice (TTS) ----------
# language_boost: mandarin -> "Chinese", cantonese -> "Chinese,Yue". Voices are set per character (character.yaml)
# and for the narrator in library/voices.yaml.
tts:
  - key: minimax-speech-2.8-hd
    provider: fal
    endpoint: fal-ai/minimax/speech-2.8-hd
    verified: 2026-09-24          # schema from fal model page: prompt, voice_setting, audio_setting, language_boost
    params:
      output_format: url
      audio_setting: {format: mp3, sample_rate: 32000, bitrate: 128000, channel: 1}

  - key: minimax-speech-2.8-turbo
    provider: fal
    endpoint: fal-ai/minimax/speech-2.8-turbo
    verified: 2026-09-24
    params:
      output_format: url
      audio_setting: {format: mp3, sample_rate: 32000, bitrate: 128000, channel: 1}

# ---------- image-to-video ----------
# durations: lengths the model can generate (seconds). A shot uses the shortest one >= its length, then assembly trims.
video:
  - key: kling-2.5-turbo-standard
    provider: fal
    endpoint: fal-ai/kling-video/v2.5-turbo/standard/image-to-video
    verified: 2026-09-24          # inputs: prompt, image_url, duration "5"|"10", negative_prompt, cfg_scale
    durations: [5, 10]
    supports_negative_prompt: true
    params: {cfg_scale: 0.5}

  - key: kling-2.5-turbo-pro
    provider: fal
    endpoint: fal-ai/kling-video/v2.5-turbo/pro/image-to-video
    verified: null                # price confirmed via pricing API; params assumed same as standard
    durations: [5, 10]
    supports_negative_prompt: true
    params: {cfg_scale: 0.5}

  - key: hailuo-02-standard
    provider: fal
    endpoint: fal-ai/minimax/hailuo-02/standard/image-to-video
    verified: 2026-09-24          # inputs: prompt, image_url, duration "6"|"10", resolution, prompt_optimizer
    durations: [6, 10]
    supports_negative_prompt: false
    params: {resolution: 768P, prompt_optimizer: false}

# ---------- lip-sync (only shots with on_camera_speech: true) ----------
lipsync:
  - key: latentsync
    provider: fal
    endpoint: fal-ai/latentsync
    verified: 2026-09-24          # inputs: video_url, audio_url, guidance_scale, seed, loop_mode
    params: {loop_mode: loop}

  - key: kling-lipsync
    provider: fal
    endpoint: fal-ai/kling-video/lipsync/audio-to-video
    verified: null                # inputs video_url, audio_url; video 2–10 s, 720–1920 px; billing unit unclear
    params: {}

  - key: sync-lipsync-v2
    provider: fal
    endpoint: fal-ai/sync-lipsync/v2
    verified: null
    params: {}
