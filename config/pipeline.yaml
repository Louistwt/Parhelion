# Deterministic pipeline settings (no AI). Change here, not in code.

speech:
  # Chinese characters per second, used for timing estimates and lint budget
  chars_per_second:
    mandarin: 4.5
    cantonese: 5.0
  max_chars_per_second: 5.0     # lint warns above this for a single line
  pause_between_lines: 0.3      # seconds added after each line
  min_line_seconds: 1.0

shots:
  min_seconds: 3.0
  max_seconds: 8.0

keyframes:
  variants_per_shot: 1         # one image per run: regenerate or discard the ones you don't want (2026-09-28)
  reroll_factor: 1.2            # used for "cost to finish" forecasts only

characters:
  variants: 1                  # one sheet per run (2026-09-28)

clips:
  variants_per_shot: 1          # video is expensive: one take, regenerate only rejected shots

assembly:
  width: 1080
  height: 1920
  fps: 30
  still_zoom: 1.08              # slow zoom for shots that have no clip yet (animatic)
  subtitle_font_size: 60
  subtitle_max_chars_per_line: 14
  subtitle_bottom_margin: 260   # px from the bottom (above platform UI)
  # First existing file wins. Install fonts-noto-cjk in WSL, or Windows' Microsoft YaHei is used.
  subtitle_fonts:
    - /usr/share/fonts/opentype/noto/NotoSansCJK-Bold.ttc
    - /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc
    - /usr/share/fonts/noto-cjk/NotoSansCJK-Regular.ttc
    - /mnt/c/Windows/Fonts/msyhbd.ttc
    - /mnt/c/Windows/Fonts/msyh.ttc

report:
  usd_to_hkd: 7.8
