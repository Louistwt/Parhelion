[project]
name = "parhelion"
version = "0.1.0"
description = "Local pipeline: script -> shot list -> keyframes -> storyboard for short training videos"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "pillow>=10.0",
]

[project.scripts]
parhelion = "parhelion.cli:app"
ph = "parhelion.cli:app"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["parhelion"]

[tool.pytest.ini_options]
testpaths = ["tests"]
